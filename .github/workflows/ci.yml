name: ClassPlay CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Core game engine smoke tests
        run: npm run test:engine

      - name: Smart Activity Builder regression tests
        run: npm run test:smart

      - name: Live engine and security contract tests
        run: npm run test:live

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
